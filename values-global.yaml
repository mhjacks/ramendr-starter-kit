---
global:
  pattern: ramendr-starter-kit
  vpNewFolderDir: true

  singleArgoCD: true
  options:
    useCSV: false
    syncPolicy: Automatic
    installPlanApproval: Automatic

  hub:
    provider: aws

main:
  # Selecting a variant loads variants/<name>/values-<name>.yaml when the
  # variants/ folder is present (global.vpNewFolderDir=true).
  # ds-drp-s4 = partner CSI + hub S4 + ODF productization of the
  # multicluster orchestrator (odf-multicluster-orchestrator) without the
  # rest of ODF (no RHDR preview catalog/IDMS/subscription).
  # odf remains the documented default in pattern-metadata.yaml.
  variant: ds-drp-s4
  multiSourceConfig:
    enabled: true
    # Need >= 0.9.57 for variants/ folder path helpers (vpNewFolderDir).
    clusterGroupChartVersion: 0.9.*
