---
# odf-ramen-trusted-ca copies cluster-proxy-ca-bundle (from vp-manage) into
# ramen-hub-operator-config s3StoreProfiles.caCertificates. Velero/OADP mounts that
# into the pod as AWS_CA_BUNDLE (/etc/pki/tls/certs/ca-bundle.crt). Namespace
# trust bundles alone do not update BackupStorageLocation caCert.
odfRamenTrustedCa:
  enabled: true

# vp-manage-proxy-cluster-ca merges PEM without legacy "# CA from …" comment markers.
odfDrPrerequisites:
  caMaterialMode: trust-bundle
