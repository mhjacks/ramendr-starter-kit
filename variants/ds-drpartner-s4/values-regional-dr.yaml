---
# Partner CSI + S4: DRPolicy + hub DRClusters + validation without DRPC/VMs.
# Requires regionaldr-with-virt 0.1.3 (ramen.opsNamespace patch).
#
# ODF productization: the spoke ramen-dr-cluster Subscription (catalog/package/
# channel/startingCSV) comes from the packaged ramen-hub-operator-config defaults
# shipped by odf-multicluster-orchestrator. regionaldr patches only
# ramenOpsNamespace (and drClusterOperator.namespaceName) below; all other
# drClusterOperator fields are set to false to skip their yq edits.
# Buckets are created by vp-s4-storage (s4Role.buckets); regionaldr upserts hub s3StoreProfiles
# only (ensureBuckets: false) and sets DRCluster.spec.s3ProfileName. opp-policy injects
# caCertificates only. (odf uses MirrorPeer for profiles; drpartner-minimal leaves
# infrastructureEnabled false.)
#
# PostSync argocd-sync-disable (wave 13) looks up the Application CR in
# pattern-clusterGroup.name (not destination $ARGOCD_APP_NAMESPACE) and adds hub
# ignoreDifferences for syncPolicy.automated so parent selfHeal cannot re-enable
# autosync after settlement.
#
# regionalDR list replace (Helm): keep cluster names; only 2m-novm DRPolicy (no 2m-vm).
ramen:
  resourcesEnabled: false
  infrastructureEnabled: true
  updateRamenConfig: true
  # Spoke operand namespace in ramen-dr-cluster ManifestWork. Must differ from
  # ramen.drClusterOperator.namespaceName (openshift-dr-system) or ACM denies
  # duplicate v1.Namespace. Pattern already creates openshift-dr-ops.
  opsNamespace: openshift-dr-ops
  drClusterOperator:
    # Inherit the ODF productization's own drClusterOperator defaults for the
    # spoke Subscription; skip every field-specific yq edit except namespaceName.
    catalogSourceName: false
    packageName: false
    channelName: false
    clusterServiceVersionName: false
    # Spoke operator namespace. Must differ from opsNamespace above or ACM
    # rejects the ramen-dr-cluster ManifestWork (duplicate v1.Namespace).
    namespaceName: openshift-dr-system

drCluster:
  s3StoreProfiles:
    ensureBuckets: false

edgeGitopsVms:
  enabled: false

regionalDR:
  - name: resilient
    clusters:
      primary:
        name: ocp-primary
      secondary:
        name: ocp-secondary
    drpolicies:
      - interval: 2m
        name: 2m-drpolicy

# Run in BYOC mode by default. Most test scenarios require this for this
# variant.
byoc: true
