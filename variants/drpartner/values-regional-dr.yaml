# Partner CSI foundation: DRPolicy + DRClusters + validation without DRPC/VMs.
# Requires regionaldr-with-virt >= 0.1.0 (ramen.infrastructureEnabled + s3StoreProfiles upsert).
ramen:
  resourcesEnabled: false
  infrastructureEnabled: true

edgeGitopsVms:
  enabled: false

# Chart defaults target hub vp-s4-storage (credentials + S3 Route discovery).
# Override under drCluster.s3StoreProfiles for a non-S4 endpoint, for example:
# drCluster:
#   s3StoreProfiles:
#     s3CompatibleEndpoint: https://s3.example.com
#     s3Region: us-east-1
#     credentialsSource:
#       name: my-s3-creds
#       namespace: my-ns
#     primary:
#       s3Bucket: ramen-primary
#     secondary:
#       s3Bucket: ramen-secondary
